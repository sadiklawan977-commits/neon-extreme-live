<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HABIBI FOOTBALL - NEON EXTREME</title>
<style>
:root{--cyan:#20f7ff;--pink:#ff27d8;--purple:#9d36ff;--green:#22ff9a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070414;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;align-items:center}
#gameShell{width:min(100vw,520px);height:100dvh;min-height:480px;display:flex;flex-direction:column;padding:5px 8px 8px;background:radial-gradient(ellipse at 50% 40%,#160b36 0%,#080416 65%,#04020d 100%)}
#intro{font-size:clamp(10px,2.7vw,13px);line-height:1.25;text-align:left;color:#f4eaff;padding:3px 5px 5px}
#intro div{margin:1px 0}
#brand{display:flex;align-items:center;justify-content:space-between;padding:4px 5px 7px}
#brandName{font-size:clamp(17px,5vw,24px);font-weight:900;letter-spacing:1.2px;color:#fff;text-shadow:0 0 5px #ff2bd6,0 0 15px #a000ff}
#hearts{font-size:clamp(18px,5vw,25px);letter-spacing:2px;filter:drop-shadow(0 0 5px #ff267d)}
#hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 2px 7px}
.hudBox{border:1px solid #6922a8;border-radius:7px;background:linear-gradient(120deg,#160b30,#09051b);padding:5px 3px;text-align:center;box-shadow:0 0 9px #7d1aff55}
.hudLabel{font-size:10px;color:#d8aaff;letter-spacing:1px}
.hudValue{font-size:clamp(13px,3.8vw,18px);font-weight:bold;color:#fff;text-shadow:0 0 8px var(--cyan)}
#stage{position:relative;flex:1;min-height:0;border:2px solid #8c20d5;border-radius:9px;overflow:hidden;box-shadow:0 0 10px #b000ff, inset 0 0 22px #30065b;background:#08051b}
canvas{width:100%;height:100%;display:block}
#toast{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);padding:9px 13px;border-radius:9px;background:#100522eF;border:1px solid var(--cyan);color:white;font-size:14px;font-weight:bold;text-align:center;display:none;box-shadow:0 0 18px #00eaff}
#bottom{display:flex;gap:9px;padding:8px 2px 2px}
button{flex:1;border:1px solid #d22bff;border-radius:8px;padding:11px 6px;background:linear-gradient(120deg,#30005d,#7d00a9);color:#fff;font-size:13px;font-weight:900;letter-spacing:.4px;text-shadow:0 0 7px #fff;box-shadow:0 0 12px #9e00ff77}
button:active{transform:scale(.97);filter:brightness(1.3)}
#status{font-size:10px;text-align:center;color:#d6b4ff;padding-top:4px;min-height:16px}
</style>
</head>
<body>
<div id="gameShell">
  <div id="intro">
    <div>✨ Gudu da ƙwallo zuwa ƙofar kore domin cin nasara.</div>
    <div>⭐ Tattara taurari, ka guji haɗari, ka tara maki.</div>
  </div>
  <div id="brand">
    <div id="brandName">⚡ NEON EXTREME ⚡</div>
    <div id="hearts">❤️❤️❤️</div>
  </div>
  <div id="hud">
    <div class="hudBox"><div class="hudLabel">LEVEL</div><div class="hudValue" id="level">1</div></div>
    <div class="hudBox"><div class="hudLabel">SCORE</div><div class="hudValue" id="score">0</div></div>
    <div class="hudBox"><div class="hudLabel">LIFE</div><div class="hudValue" id="life">3</div></div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="toast"></div>
  </div>
  <div id="bottom">
    <button id="restart">↻ SAKE FARA WASA</button>
    <button id="pause">Ⅱ DAKATA</button>
  </div>
  <div id="status">🔵 Ƙwallo tana bin hanya da kanta — AUTO PLAY</div>
</div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const stage=document.getElementById("stage");
const $=id=>document.getElementById(id);
const COLS=15,ROWS=21;
let W=0,H=0,cell=0,ox=0,oy=0,dpr=1;
let grid=[],route=[],routeAt=0,ball={x:1,y:1},stars=[],hazards=[],particles=[];
let level=1,score=0,lives=3,paused=false,over=false,won=false;
let lastStep=0,lastFrame=0,hitCooldown=0,toastTimer=0,animation=0;
const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
function resize(){
 const r=stage.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);
 W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 cell=Math.min(W/COLS,H/ROWS);ox=(W-COLS*cell)/2;oy=(H-ROWS*cell)/2;
}
window.addEventListener("resize",resize);
function makeMaze(){
 grid=Array.from({length:ROWS},()=>Array(COLS).fill(1));
 function carve(x,y){
  grid[y][x]=0;
  const ds=[[0,-2],[2,0],[0,2],[-2,0]].sort(()=>Math.random()-.5);
  for(const [dx,dy] of ds){
   const nx=x+dx,ny=y+dy;
   if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&grid[ny][nx]===1){
    grid[y+dy/2][x+dx/2]=0;carve(nx,ny);
   }
  }
 }
 carve(1,1);
 grid[ROWS-2][COLS-2]=0;
 // Open a few extra side passages to make the maze feel wider and more arcade-like.
 for(let i=0;i<12;i++){
  const x=1+Math.floor(Math.random()*(COLS-2)),y=1+Math.floor(Math.random()*(ROWS-2));
  if(grid[y][x]===1&&dirs.some(([dx,dy])=>grid[y+dy]?.[x+dx]===0)&&Math.random()<.48)grid[y][x]=0;
 }
 return solve();
}
function solve(){
 const start="1,1",end=(COLS-2)+","+(ROWS-2),q=[[1,1]],seen=new Set([start]),prev={};
 let found=false;
 while(q.length){
  const [x,y]=q.shift(),key=x+","+y;
  if(key===end){found=true;break;}
  for(const [dx,dy] of dirs){
   const nx=x+dx,ny=y+dy,k=nx+","+ny;
   if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&grid[ny][nx]===0&&!seen.has(k)){
    seen.add(k);prev[k]=key;q.push([nx,ny]);
   }
  }
 }
 route=[];
 if(found){
  let k=end;
  while(k!==start){const [x,y]=k.split(",").map(Number);route.unshift({x,y});k=prev[k];}
 }
 routeAt=0;ball={x:1,y:1};
}
function placeItems(){
 stars=[];hazards=[];particles=[];
 const open=[];
 for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
  if(grid[y][x]===0&&!(x===1&&y===1)&&!(x===COLS-2&&y===ROWS-2))open.push({x,y});
 }
 // Place collectible stars away from the start and exit.
 open.sort(()=>Math.random()-.5);
 for(let i=0;i<Math.min(18,open.length);i++)if(i%2===0)stars.push({...open[i],taken:false,phase:Math.random()*6});
 // Pink moving hazards are visual obstacles; collisions cost one life.
 for(let i=0;i<Math.min(4,Math.floor(level/2)+2);i++){
  const p=open[(i*7+5)%open.length];if(p)hazards.push({x:p.x,y:p.y,phase:Math.random()*6,dir:Math.random()<.5?1:-1});
 }
}
function newLevel(){
 makeMaze();placeItems();$('status').textContent="🔵 Ƙwallo tana bin hanya da kanta — AUTO PLAY";
}
function reset(){
 level=1;score=0;lives=3;paused=false;over=false;won=false;hitCooldown=0;
 $('pause').textContent="Ⅱ DAKATA";$('toast').style.display="none";
 newLevel();updateHud();
}
function updateHud(){
 $('level').textContent=level;$('score').textContent=score;$('life').textContent=lives;
 $('hearts').textContent="❤️".repeat(Math.max(0,lives))+"🖤".repeat(3-Math.max(0,lives));
}
function message(t,ms=1300){
 const el=$('toast');el.textContent=t;el.style.display="block";
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display="none",ms);
}
function addBurst(x,y,color="#ff36db"){
 for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*2.8,vy:(Math.random()-.5)*2.8,life:24,color});
}
function step(){
 if(over||paused||!route.length)return;
 if(routeAt>=route.length){
  score+=100;level++;updateHud();message("🎉 LEVEL "+(level-1)+" AN KAMMALA! +100",1400);
  newLevel();return;
 }
 const next=route[routeAt++];
 ball={x:next.x,y:next.y};
 for(const s of stars){
  if(!s.taken&&s.x===ball.x&&s.y===ball.y){s.taken=true;score+=10;addBurst(ball.x,ball.y,"#fff45c");}
 }
 if(hitCooldown<=0){
  for(const h of hazards){
   const hx=h.x+Math.sin(animation*.0015+h.phase)*.35;
   const hy=h.y+Math.cos(animation*.0012+h.phase)*.25;
   if(Math.hypot(ball.x-hx,ball.y-hy)<.48){
    lives--;hitCooldown=12;addBurst(ball.x,ball.y,"#ff3c75");message("💥 AN BUGA KA! -1 LIFE",850);
    if(lives<=0){over=true;message("GAME OVER — Danna SAKE FARA WASA",5000);}
    break;
   }
  }
 }
 if(hitCooldown>0)hitCooldown--;
 updateHud();
}
function roundedRect(x,y,w,h,r){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);
}
function drawWall(x,y,t){
 const px=ox+x*cell,py=oy+y*cell;
 ctx.save();
 ctx.shadowBlur=8;ctx.shadowColor="#a000ff";
 const g=ctx.createLinearGradient(px,py,px+cell,py+cell);
 g.addColorStop(0,"#351064");g.addColorStop(.55,"#170c3e");g.addColorStop(1,"#5a126d");
 ctx.fillStyle=g;roundedRect(px+1,py+1,cell-2,cell-2,Math.max(2,cell*.12));ctx.fill();
 ctx.shadowBlur=0;ctx.strokeStyle="#a52cff";ctx.globalAlpha=.7;ctx.lineWidth=1;
 ctx.stroke();ctx.restore();
}
function drawPortal(){
 const x=ox+(COLS-1.5)*cell,y=oy+(ROWS-1.5)*cell,r=cell*.42;
 ctx.save();ctx.translate(x,y);
 const pulse=1+Math.sin(animation*.006)*.08;
 ctx.scale(pulse,pulse);ctx.shadowBlur=22;ctx.shadowColor="#00ff9c";
 ctx.strokeStyle="#19ffad";ctx.lineWidth=Math.max(2,cell*.12);
 ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#08ff9a33";ctx.fill();
 ctx.shadowBlur=0;ctx.fillStyle="#caffed";ctx.font=`bold ${Math.max(7,cell*.24)}px Arial`;ctx.textAlign="center";ctx.fillText("GIDA",0,r+cell*.35);
 ctx.restore();
}
function drawBall(){
 const x=ox+(ball.x+.5)*cell,y=oy+(ball.y+.5)*cell,r=cell*.31;
 ctx.save();ctx.shadowBlur=24;ctx.shadowColor="#00eaff";
 const g=ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r);
 g.addColorStop(0,"#ffffff");g.addColorStop(.25,"#a5ffff");g.addColorStop(.65,"#00cfff");g.addColorStop(1,"#0755ff");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createRadialGradient(W*.5,H*.45,5,W*.5,H*.5,Math.max(W,H)*.7);
 bg.addColorStop(0,"#170b36");bg.addColorStop(1,"#050313");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // tiny moving stars in the background
 for(let i=0;i<45;i++){
  const x=(i*71.3+Math.sin(animation*.0005+i)*9)%W;
  const y=(i*113.7+animation*.012*(i%3+1))%H;
  ctx.fillStyle=i%3===0?"#ff4bd8":"#5c4caa";ctx.globalAlpha=.35+.35*Math.sin(animation*.003+i);
  ctx.fillRect(x,y,1.5,1.5);
 }
 ctx.globalAlpha=1;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x]===1)drawWall(x,y);
 // collectible stars
 for(const s of stars)if(!s.taken){
  const x=ox+(s.x+.5)*cell,y=oy+(s.y+.5)*cell;
  ctx.save();ctx.translate(x,y);ctx.rotate(animation*.001+s.phase);
  ctx.shadowBlur=13;ctx.shadowColor="#ff35d8";ctx.fillStyle="#ff54df";
  ctx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?cell*.12:cell*.25;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.restore();
 }
 // floating pink diamonds and sparkles
 for(const h of hazards){
  const x=ox+(h.x+.5+Math.sin(animation*.0015+h.phase)*.22)*cell;
  const y=oy+(h.y+.5+Math.cos(animation*.0012+h.phase)*.18)*cell;
  ctx.save();ctx.translate(x,y);ctx.rotate(animation*.0018*h.dir);
  ctx.shadowBlur=14;ctx.shadowColor="#ff248d";ctx.fillStyle="#ff299d";
  ctx.beginPath();ctx.moveTo(0,-cell*.34);ctx.lineTo(cell*.25,0);ctx.lineTo(0,cell*.34);ctx.lineTo(-cell*.25,0);ctx.closePath();ctx.fill();ctx.restore();
 }
 drawPortal();drawBall();
 // particles
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*.03;p.y+=p.vy*.03;p.life--;
  ctx.globalAlpha=Math.max(0,p.life/24);ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(ox+(p.x+.5)*cell,oy+(p.y+.5)*cell,2.2,0,Math.PI*2);ctx.fill();
  if(p.life<=0)particles.splice(i,1);
 }
 ctx.globalAlpha=1;
 if(paused||over){
  ctx.fillStyle="#050313bb";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";ctx.shadowBlur=12;ctx.shadowColor="#00eaff";ctx.fillStyle="#fff";
  ctx.font=`bold ${Math.max(20,cell*.8)}px Arial`;
  ctx.fillText(over?"GAME OVER":"DAKATA",W/2,H/2);
  ctx.shadowBlur=0;ctx.font=`${Math.max(11,cell*.35)}px Arial`;
  ctx.fillText(over?"Danna SAKE FARA WASA":"Danna DAKATA domin ci gaba",W/2,H/2+cell);
 }
}
function loop(t){
 animation=t;
 if(!lastFrame)lastFrame=t;
 if(!paused&&!over&&t-lastStep>155){step();lastStep=t;}
 draw();requestAnimationFrame(loop);
}
$('restart').addEventListener('click',()=>{reset();message("AN SAKE FARA WASA! 🔥",1000);});
$('pause').addEventListener('click',()=>{
 if(over)return;paused=!paused;
 $('pause').textContent=paused?"▶ CI GABA":"Ⅱ DAKATA";
 message(paused?"AN DAKATA":"AN CI GABA",800);
});
resize();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
